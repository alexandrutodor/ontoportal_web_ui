name: "Offline tests CI"

on:
  push:
  pull_request:
    types: [ opened, reopened, synchronize ]

permissions:
  contents: read

jobs:
  offline-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Run offline shell tests
        run: bash test/bin/run_api_test.sh

  offline-rspec-helper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1.0
          bundler-cache: true

      - name: Run offline SPARQL helper RSpec
        run: bundle exec rspec spec/helpers/sparql_spec.rb spec/offline_network_boundary_spec.rb

  legacy-rspec:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        ports:
          - "3306:3306"
        env:
          MYSQL_ROOT_PASSWORD: root
    env:
      DB_HOST: 127.0.0.1
      RAILS_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1.0
          bundler-cache: true

      - name: Set up config file
        run: cp config/database.yml.sample config/database.yml

      - name: Set up database schema
        run: bin/rails db:create db:schema:load

      # spec/lib is excluded: the KGCL change-request feature is unreachable (no create route, GitHub::Client initializer commented out, Zeitwerk cannot load KGCL)
      - name: Run legacy RSpec
        run: bundle exec rspec spec/components spec/mailers spec/models spec/services
